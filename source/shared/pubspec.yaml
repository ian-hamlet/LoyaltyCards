name: shared
description: "A new Flutter package project."
# always keep the 3 pubspec.yaml files and the version .dart file in sync with the same version number
# source/shared/lib/version.dart: 
version: 2.2.2+37
homepage:

environment:
  sdk: ^3.11.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Cryptography for signature verification
  pointycastle: ^4.0.0

  # HMAC/SHA-256 key derivation in supplier_config_backup.dart - was only a
  # transitive dependency (via pointycastle), made direct.
  crypto: ^3.0.7

  # Structured logging
  logger: ^2.5.0

  # Opens the OS Settings app for the user, used by ScannerPermissionErrorView
  # to recover from a denied camera permission without needing the heavier
  # permission_handler package (mobile_scanner already handles the actual
  # permission request/check).
  app_settings: ^9.0.0

  # For ScannerPermissionErrorView's MobileScannerException/error-code types -
  # kept in sync with the version customer_app/supplier_app depend on directly.
  mobile_scanner: ^7.2.0

  # For AppReferralScreen (QR + share sheet for companion-app/friend
  # referrals) - kept in sync with the versions customer_app/supplier_app
  # depend on directly.
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  test: ^1.24.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
