name: customer_app
description: "LoyaltyCards Customer App - Digital loyalty card wallet"
publish_to: 'none'

# always keep the 3 pubspec.yaml files and the version .dart file in sync with the same version number
# source/shared/lib/version.dart: 
version: 1.6.0+17

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared package with core models and utilities
  shared:
    path: ../shared

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  
  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # Utilities
  crypto: ^3.0.3
  uuid: ^4.3.0
  device_info_plus: ^13.1.0
  local_auth: ^3.0.1

  # Preferences
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  test: ^1.24.0
  sqflite_common_ffi: ^2.3.0  # For desktop testing

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

