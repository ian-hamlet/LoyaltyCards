name: supplier_app
description: "LoyaltyCards Business App - Issue and manage loyalty cards"
publish_to: 'none'

# always keep the 3 pubspec.yaml files and the version .dart file in sync with the same version number
# source/shared/lib/version.dart: 
version: 2.2.2+37

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared package with core models and utilities
  shared:
    path: ../shared

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  
  # Cryptography
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  
  # Secure Storage
  flutter_secure_storage: ^11.0.0
  
  # Biometric Authentication (Face ID / Touch ID / Passcode)
  local_auth: ^3.0.1
  
  # Utilities
  uuid: ^4.3.0
  intl: ^0.20.2
  shared_preferences: ^2.3.3

  # Backup Storage Options
  share_plus: ^13.3.0            # Share via email/files
  printing: ^5.13.4             # Print PDF functionality
  pdf: ^3.11.1                  # Generate PDF documents

  # Web links (Settings -> Help & Guides)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  test: ^1.24.0
  sqflite_common_ffi: ^2.3.0  # For desktop testing
  local_auth_platform_interface: ^1.1.0  # For faking LocalAuthPlatform.instance in biometric_auth_service_test.dart
  flutter_launcher_icons: ^0.14.4

# Android app icon - the mipmap-*/ic_launcher.png files were still Flutter's
# default placeholder logo (never generated for Android). Source is the same
# branded icon already used for iOS/macOS. Generates both the legacy
# ic_launcher.png set and an Android 8+ adaptive icon (mipmap-anydpi-v26).
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png"
  adaptive_icon_background: "#F0532A"
  adaptive_icon_foreground: "ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png"

flutter:
  uses-material-design: true

  # NotoSans-Regular/Bold: embedded in generated PDFs (backup/audit-trail
  # printing) so business names with non-Latin characters render correctly.
  # The `pdf` package's default Helvetica is WinAnsi-only. SIL OFL 1.1
  # licensed - see assets/fonts/NotoSans-OFL.txt.
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

