name: customer_app
description: "LoyaltyCards Customer App - Digital loyalty card wallet"
publish_to: 'none'

# always keep the 3 pubspec.yaml files and the version .dart file in sync with the same version number
# source/shared/lib/version.dart: 
version: 2.2.3+38

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared package with core models and utilities
  shared:
    path: ../shared

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # Utilities
  crypto: ^3.0.3
  uuid: ^4.3.0
  device_info_plus: ^13.1.0
  local_auth: ^3.0.1

  # Preferences
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  test: ^1.24.0
  sqflite_common_ffi: ^2.3.0  # For desktop testing
  flutter_launcher_icons: ^0.14.4

# Android app icon - the mipmap-*/ic_launcher.png files were still Flutter's
# default placeholder logo (never generated for Android). Source is the same
# branded icon already used for iOS/macOS. Generates both the legacy
# ic_launcher.png set and an Android 8+ adaptive icon (mipmap-anydpi-v26).
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png"
  adaptive_icon_background: "#F2642E"
  adaptive_icon_foreground: "ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png"

flutter:
  uses-material-design: true

